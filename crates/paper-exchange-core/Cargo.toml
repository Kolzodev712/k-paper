[package]
name = "paper-exchange-core"
version = "0.1.0"
edition = "2021"
description = "Core logic for the standalone paper exchange: orderbook, matching, account, streams."
license = "UNLICENSED"

[dependencies]
rust_decimal = { version = "1.33", features = ["maths"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
