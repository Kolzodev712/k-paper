[workspace]
resolver = "2"
members = [
    ".",
    "crates/paper-exchange-core",
    "crates/paper-exchange-scenarios",
    "crates/paper-exchange-server",
]

[package]
name = "k-paper"
version = "0.1.0"
edition = "2021"
description = "Standalone paper exchange — main system binary."
license = "Apache-2.0"

[[bin]]
name = "k-paper"
path = "src/main.rs"

[dependencies]
paper-exchange-core = { path = "crates/paper-exchange-core" }
paper-exchange-server = { path = "crates/paper-exchange-server" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
rust_decimal = { version = "1.33", features = ["maths"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
rand = "0.8"

[[example]]
name = "scripted_scenario"
path = "examples/scripted_scenario.rs"

[[example]]
name = "procedural_demo"
path = "examples/procedural_demo.rs"

[[example]]
name = "external_http_client"
path = "examples/external_http_client.rs"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1.0"
