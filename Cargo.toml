[workspace]
resolver = "2"
members = [
    ".",
    "crates/paper-exchange-core",
    "crates/paper-exchange-server",
]

[package]
name = "k-paper"
version = "0.1.0"
edition = "2021"
description = "Standalone paper exchange — main system binary."
license = "UNLICENSED"

[[bin]]
name = "k-paper"
path = "src/main.rs"

[dependencies]
paper-exchange-core = { path = "crates/paper-exchange-core" }
paper-exchange-server = { path = "crates/paper-exchange-server" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
rust_decimal = { version = "1.33", features = ["maths"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
rand = "0.8"

[[example]]
name = "scripted_scenario"
path = "examples/scripted_scenario.rs"

[[example]]
name = "procedural_demo"
path = "examples/procedural_demo.rs"
