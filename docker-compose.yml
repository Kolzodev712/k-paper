# If you see KeyError: 'ContainerConfig' with docker-compose v1, run:
#   docker-compose down && docker-compose up --build
# Or use Docker Compose V2: docker compose up --build

version: "3.8"

services:
  paper-exchange:
    build: .
    ports:
      # Default: loopback only. Override deliberately if you need LAN access.
      - "127.0.0.1:19999:19999"
    environment:
      # Listen on all container interfaces; host publish stays loopback above.
      PAPER_EXCHANGE_HOST: "0.0.0.0"
      PAPER_EXCHANGE_PORT: "19999"
      PAPER_EXCHANGE_DUMMY_OB: "1"
      PAPER_EXCHANGE_CONFIG: "/app/config/instruments.yaml"
      # Uncomment to mount the /test/* lab fault endpoints (off by default).
      # Laboratory Compose sets PAPER_LAB_FAULTS=1 explicitly; standalone stays off.
      # PAPER_LAB_FAULTS: "1"
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    # deploy.resources only apply in Swarm; if you see exit 137 (OOM), increase Docker memory
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
